<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ChatApp - Login</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="card">
  <h1>Welcome back</h1>
  <p>Sign in to continue your conversations.</p>
  <input id="identifier" placeholder="Email or phone" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button onclick="login()">Login</button>
  <p id="msg"></p>
  <a href="signup.html">New here? Create an account</a>
</div>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
