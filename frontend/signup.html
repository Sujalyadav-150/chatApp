<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ChatApp - Signup</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="card">
  <h1>Create your account</h1>
  <p>Join your conversations in a few seconds.</p>
  <input id="name" placeholder="Full name" autocomplete="name">
  <input id="email" type="email" placeholder="Email" autocomplete="email">
  <input id="phone" placeholder="Phone number" autocomplete="tel">
  <input id="password" type="password" placeholder="Password" autocomplete="new-password">
  <button onclick="signup()">Create account</button>
  <p id="msg"></p>
  <a href="login.html">Already have an account? Login</a>
</div>
<script src="js/auth.js"></script>
</body>
</html>
